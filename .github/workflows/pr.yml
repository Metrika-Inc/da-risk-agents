name: Pull Request

# Addresses the Vanta control `github-code-change-automated-checks-enabled`.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: metrika-inc/gh-action/.github/workflows/repo-lint.yml@main
